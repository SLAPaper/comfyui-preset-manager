# Qwen Image Edit Workflow Template
# Supports both TextEncodeQwenImageEdit and TextEncodeQwenImageEditPlus
# Uses VAEEncode (not EmptyLatentImage), so width/height are not extractable
# Reference image (LoadImage) is not managed by presets

name: "Qwen Image Edit"
description: "Qwen Image Edit 图像编辑 workflow（支持文生图和图生图）"
version: "1.0"

node_mapping:
  # 提示词 —— 通过 KSampler 的输入连接定位
  positive_prompt:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "positive"
    widget: "prompt"

  negative_prompt:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "negative"
    widget: "prompt"

  # 采样参数 —— KSampler 节点
  sampler:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "sampler_name"

  scheduler:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "scheduler"

  steps:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "steps"

  cfg:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "cfg"

  # 输出尺寸 —— 通过 KSampler 的 latent_image 输入追踪到 EmptySD3LatentImage
  width:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "latent_image"
    widget: "width"

  height:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "latent_image"
    widget: "height"

  # 模型加载器 —— 每种 loader 类独立字段，覆盖 UNETLoader 标准 + GGUF/Nunchaku 变体
  unet_name:
    match_strategy: "unique_class"
    class_type: "UNETLoader"
    widget: "unet_name"
  gguf_unet_name:
    match_strategy: "unique_class"
    class_type: "UnetLoaderGGUF"
    widget: "unet_name"
  gguf_unet_advanced_name:
    match_strategy: "unique_class"
    class_type: "UnetLoaderGGUFAdvanced"
    widget: "unet_name"
  nf4_unet_name:
    match_strategy: "unique_class"
    class_type: "UNETLoaderNF4"
    widget: "unet_name"
  nunchaku_model_name:
    match_strategy: "unique_class"
    class_type: "NunchakuQwenImageDiTLoader"
    widget: "model_name"

  # CLIP —— 单 CLIP / 双 CLIP
  clip_name:
    match_strategy: "unique_class"
    class_type: "CLIPLoader"
    widget: "clip_name"
  dual_clip_name1:
    match_strategy: "unique_class"
    class_type: "DualCLIPLoader"
    widget: "clip_name1"

  # VAE
  vae_name:
    match_strategy: "unique_class"
    class_type: "VAELoader"
    widget: "vae_name"

  # Checkpoint —— 标准 / GGUF / NF4 量化
  ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderSimple"
    widget: "ckpt_name"
  gguf_ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderGGUF"
    widget: "ckpt_name"
  nf4_ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderNF4"
    widget: "ckpt_name"

# 同义节点映射
synonyms:
  KSamplerAdvanced: "KSampler"
  KSamplerEfficient: "KSampler"
