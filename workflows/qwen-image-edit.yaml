# Qwen Image Edit Workflow Template
# Prompt nodes are located through the KSampler inputs.
# Width and height follow the latent_image input; image-to-image workflows
# that encode an input image have no width/height widget to write.
# Reference image (LoadImage) is not managed by presets

name: "Qwen Image Edit"
description: "Qwen Image Edit 图像编辑 workflow（支持文生图和图生图）"
include: "_loaders"

node_mapping:
  # 提示词 —— 通过 KSampler 的输入连接定位
  positive_prompt:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "positive"
    widget: "prompt"

  negative_prompt:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "negative"
    widget: "prompt"

  # 采样参数 —— KSampler 节点
  sampler:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "sampler_name"

  scheduler:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "scheduler"

  steps:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "steps"

  cfg:
    match_strategy: "unique_class"
    class_type: "KSampler"
    widget: "cfg"

  # 输出尺寸 —— 通过 KSampler 的 latent_image 输入追溯到 latent 节点
  width:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "latent_image"
    widget: "width"

  height:
    match_strategy: "input_slot"
    class_type: "KSampler"
    input_name: "latent_image"
    widget: "height"

# 同义节点映射
synonyms:
  KSamplerAdvanced: "KSampler"
  KSamplerEfficient: "KSampler"
