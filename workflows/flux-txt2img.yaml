# Flux Text-to-Image Workflow Template
# Defines parameter mapping for Flux workflows
# Flux uses different node architecture: BasicScheduler + KSamplerSelect + FluxGuidance

name: "Flux Text to Image"
description: "Flux 基础文生图 workflow"
version: "1.0"

node_mapping:
  positive_prompt:
    match_strategy: "title_keyword"
    class_type: "CLIPTextEncode"
    title_keywords: ["positive", "正向"]
    widget: "text"

  negative_prompt:
    match_strategy: "title_keyword"
    class_type: "CLIPTextEncode"
    title_keywords: ["negative", "负向"]
    widget: "text"
    optional: true

  steps:
    match_strategy: "unique_class"
    class_type: "BasicScheduler"
    widget: "steps"

  sampler:
    match_strategy: "unique_class"
    class_type: "KSamplerSelect"
    widget: "sampler_name"

  cfg:
    match_strategy: "unique_class"
    class_type: "FluxGuidance"
    widget: "guidance"

  scheduler:
    match_strategy: "unique_class"
    class_type: "BasicScheduler"
    widget: "scheduler"

  seed:
    match_strategy: "output_connection"
    target_class_type: "RandomNoise"
    target_input: "noise_seed"
    widget: "noise_seed"

  denoise:
    match_strategy: "unique_class"
    class_type: "BasicScheduler"
    widget: "denoise"

  width:
    match_strategy: "output_connection"
    target_class_type: "ModelSamplingFlux"
    target_input: "width"
    widget: "value"

  height:
    match_strategy: "output_connection"
    target_class_type: "ModelSamplingFlux"
    target_input: "height"
    widget: "value"

  # 模型加载器 —— 每种 loader 类独立字段，覆盖 UNETLoader 标准 + GGUF/Nunchaku 变体
  unet_name:
    match_strategy: "unique_class"
    class_type: "UNETLoader"
    widget: "unet_name"
  gguf_unet_name:
    match_strategy: "unique_class"
    class_type: "UnetLoaderGGUF"
    widget: "unet_name"
  gguf_unet_advanced_name:
    match_strategy: "unique_class"
    class_type: "UnetLoaderGGUFAdvanced"
    widget: "unet_name"
  nf4_unet_name:
    match_strategy: "unique_class"
    class_type: "UNETLoaderNF4"
    widget: "unet_name"
  nunchaku_model_name:
    match_strategy: "unique_class"
    class_type: "NunchakuQwenImageDiTLoader"
    widget: "model_name"

  # CLIP —— 单 CLIP / 双 CLIP
  clip_name:
    match_strategy: "unique_class"
    class_type: "CLIPLoader"
    widget: "clip_name"
  dual_clip_name1:
    match_strategy: "unique_class"
    class_type: "DualCLIPLoader"
    widget: "clip_name1"

  # VAE
  vae_name:
    match_strategy: "unique_class"
    class_type: "VAELoader"
    widget: "vae_name"

  # Checkpoint —— 标准 / GGUF / NF4 量化
  ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderSimple"
    widget: "ckpt_name"
  gguf_ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderGGUF"
    widget: "ckpt_name"
  nf4_ckpt_name:
    match_strategy: "unique_class"
    class_type: "CheckpointLoaderNF4"
    widget: "ckpt_name"
