# Qwen Image 默认采样配置
# Provides default values for Qwen Image text-to-image generation

name: "默认配置"
description: "Qwen Image 默认采样配置"
workflow_template: "qwen-image-txt2img"

params:
  positive_prompt: "anime style picture, best quality, ultra detailed"
  negative_prompt: "worst quality, low quality, blurry"
  width: 1328
  height: 1328
  steps: 8
  cfg: 1.5
  sampler: "euler_ancestral"
  scheduler: "bong_tangent"

  # 模型加载器
  unet_name: "QwenImage\\qwen_image_fp8_e4m3fn.safetensors"
  clip_name: "Qwen25VL\\qwen_2.5_vl_7b_fp8_scaled.safetensors"
  vae_name: "Image\\qwen_image_vae.safetensors"
